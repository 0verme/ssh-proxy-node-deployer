interface:
  display_name: "SSH Proxy Node Deployer"
  short_description: "Initialize accounts safely by SSH identity, then deploy a proxy node"
  default_prompt: "使用 $ssh-proxy-node-deployer。未选模式时先问新手/高手；账户分支只按初始 SSH 用户判断：新手 root 创建或审计复用 vps，非 root 复用原用户；高手默认不改账户。先只读检查并报告计划，独立验证账户后再部署。生成配置前询问客户端（可多选）；只有高手模式询问高级设置。"
